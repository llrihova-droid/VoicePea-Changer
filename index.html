<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voizz Voice System</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .voizz-box {
      width: 850px;
      max-width: 90vw;
      background: #181818;
      color: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px #000;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .google-btn {
      flex: 1;
      background: #ffffff;
      color: #000000;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn:hover { background: #e6e6e6; }

    textarea {
      width: 100%;
      height: 140px;
      font-size: 22px;
      border-radius: 12px;
      padding: 12px;
      resize: none;
      background: #282828;
      color: white;
      border: 1px solid #444;
    }

    select, input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 8px;
      background: #282828;
      color: white;
      border: 1px solid #444;
    }

    label {
      font-size: 14px;
      margin-top: 10px;
      display: block;
    }

    button {
      margin: 5px;
      padding: 12px 20px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      background: #444;
      color: white;
      transition: background 0.2s;
    }

    button:hover { background: #666; }

    #voizzSpeak { background: #1db954; color: black; font-weight: bold; }
    #voizzSpeak:hover { background: #1ed760; }
    #voizzStop, #voizzStopLoop { background: #e91429; }
    #voizzStop:hover, #voizzStopLoop:hover { background: #ff2a3b; }
    #openBuilder { background: #f59e0b; color: black; font-weight: bold; }
    #openBuilder:hover { background: #fbbf24; }

    /* BUILDER MODAL OVERLAY */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      width: 500px;
      max-width: 90vw;
      background: #222222;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 24px;
    }

    .modal-content h3 {
      margin-top: 0;
      color: #1db954;
    }
  </style>
</head>
<body>

  <div class="voizz-box">
    
    <div class="header-bar">
      <button class="google-btn" id="googleAuth">
        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18" height="18" alt="G">
        Sign in with Google
      </button>
      <button id="openBuilder">🛠️ Builder</button>
    </div>

    <textarea id="voizzText" placeholder="Type something..."></textarea>

    <select id="voizzVoices"></select>

    <label>🔊 Volume</label>
    <input id="voizzVolume" type="range" min="0" max="1" step="0.01" value="1">

    <label>⚡ Rate</label>
    <input id="voizzRate" type="range" min="0.5" max="2" step="0.1" value="1">

    <label>🎼 Pitch</label>
    <input id="voizzPitch" type="range" min="0" max="2" step="0.1" value="1">

    <div style="margin-top: 15px;">
      <button id="voizzSpeak">🎤 Speak</button>
      <button id="voizzStop">⛔ Stop</button>
      <button id="voizzDice">🎲 Dice</button>
      <button id="voizzLoop">🔁 Loop</button>
      <button id="voizzStopLoop">⛔ Stop Loop</button>
    </div>
  </div>

  <!-- BUILDER POPUP (ONLY OPENS WHEN CLICKING 🛠️ BUILDER) -->
  <div class="modal-overlay" id="builderModal">
    <div class="modal-content">
      <h3>🛠️ Custom Voice Builder</h3>
      <p style="font-size: 14px; color: #ccc;">
        Record a 10-second voice sample to generate a PCM pitch profile.
      </p>

      <label>Voice Profile Name:</label>
      <input type="text" id="builderProfileName" value="Cyber Pitch Alpha">

      <blockquote style="font-style: italic; font-size: 13px; color: #aaa; border-left: 3px solid #1db954; margin: 15px 0; padding-left: 10px;">
        "Safehost VoicePea changer streams high-definition real-time digital audio."
      </blockquote>

      <div style="font-size: 24px; font-weight: bold; text-align: center; color: #1db954; margin: 15px 0;">
        10.0s
      </div>

      <div style="display: flex; gap: 10px;">
        <button id="startRecord" style="flex: 1; background: #1db954; color: black; font-weight: bold;">🔴 Start 10s Recording</button>
        <button id="closeBuilder">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const text = document.getElementById("voizzText");
    const voicesBox = document.getElementById("voizzVoices");
    const volume = document.getElementById("voizzVolume");
    const rate = document.getElementById("voizzRate");
    const pitch = document.getElementById("voizzPitch");

    // Modal controls
    const builderModal = document.getElementById("builderModal");
    const openBuilder = document.getElementById("openBuilder");
    const closeBuilder = document.getElementById("closeBuilder");

    openBuilder.onclick = () => builderModal.classList.add("active");
    closeBuilder.onclick = () => builderModal.classList.remove("active");

    let voices = [];
    let looping = false;

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      voicesBox.innerHTML = "";
      voices.forEach(v => {
        const option = document.createElement("option");
        option.textContent = v.name + " (" + v.lang + ")";
        option.value = v.name;
        voicesBox.appendChild(option);
      });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function speak() {
      if (!text.value.trim()) return;
      speechSynthesis.cancel();

      let msg = new SpeechSynthesisUtterance(text.value);
      let voice = voices.find(v => v.name === voicesBox.value);
      if (voice) msg.voice = voice;

      let loud = text.value === text.value.toUpperCase();
      msg.volume = loud ? 1 : Number(volume.value);
      msg.rate = Number(rate.value);
      msg.pitch = loud ? Math.min(2, Number(pitch.value) + 0.5) : Number(pitch.value);

      msg.onend = () => {
        if (looping) speak();
      };

      speechSynthesis.speak(msg);
    }

    function stop() {
      speechSynthesis.cancel();
    }

    function dice() {
      const words = ["matrix", "voice", "system", "glitch", "AI", "signal", "hello", "future", "robot"];
      text.value += (text.value ? " " : "") + words[Math.floor(Math.random() * words.length)];
      speak();
    }

    document.getElementById("voizzSpeak").onclick = speak;
    document.getElementById("voizzStop").onclick = stop;
    document.getElementById("voizzDice").onclick = dice;

    document.getElementById("voizzLoop").onclick = () => {
      looping = true;
      speak();
    };

    document.getElementById("voizzStopLoop").onclick = () => {
      looping = false;
      stop();
    };

    text.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        speak();
      }
    });

    console.log("✨ VOIZZ Voice System initialized locally.");
  </script>
</body>
</html>
